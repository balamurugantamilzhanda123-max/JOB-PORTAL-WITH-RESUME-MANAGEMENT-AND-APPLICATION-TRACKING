services:
  postgres:
    image: postgres:16-alpine
    container_name: talentforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ats_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - talentforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ats_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talentforge_pgdata:
    driver: local

